<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crash Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-ring">
          <span class="logo-icon">✈</span>
        </div>
        <div>
          <h1 class="app-title">Crash Tracker</h1>
          <span class="app-subtitle">Live Data Capture</span>
        </div>
      </div>
      <div class="header-right">
        <div id="status-pill" class="status-pill idle">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Idle</span>
        </div>
      </div>
    </header>

    <!-- Big Last Crash Multiplier Hero -->
    <div class="hero-card">
      <div class="hero-label">Last Crash</div>
      <div id="hero-multiplier" class="hero-value">—</div>
      <div id="hero-time" class="hero-time">Waiting for crash...</div>
    </div>

    <!-- Stats Row -->
    <div class="stats-row">
      <div class="stat-pill">
        <span class="stat-icon">🎯</span>
        <div>
          <div class="stat-pill-label">Rounds</div>
          <div id="stat-rounds" class="stat-pill-value">0</div>
        </div>
      </div>
      <div class="stat-pill">
        <span class="stat-icon">⚡</span>
        <div>
          <div class="stat-pill-label">Events</div>
          <div id="stat-events" class="stat-pill-value">0</div>
        </div>
      </div>
      <div class="stat-pill">
        <span class="stat-icon">⏱</span>
        <div>
          <div class="stat-pill-label">Session</div>
          <div id="session-timer" class="stat-pill-value mono">00:00</div>
        </div>
      </div>
    </div>

    <!-- Main Controls -->
    <div class="controls-main">
      <button id="btn-start" class="btn btn-start">
        <span>▶</span> Start Capture
      </button>
      <button id="btn-stop" class="btn btn-stop" disabled>
        <span>■</span> Stop
      </button>
    </div>

    <!-- Secondary Controls -->
    <div class="controls-secondary">
      <button id="btn-export" class="btn-icon-only" title="Export JSON">
        <span>⬇</span>
      </button>
      <button id="btn-clear" class="btn-icon-only danger" title="Clear Data">
        <span>🗑</span>
      </button>
      <button id="btn-debug" class="btn-icon-only" title="Debug Mode">
        <span>🐛</span>
      </button>
      <span id="badge-count" class="events-badge">0</span>
    </div>

    <!-- Live Feed -->
    <div class="feed-section">
      <div class="feed-header">
        <span>Live Feed</span>
        <span id="feed-count" class="feed-count">0 events</span>
      </div>
      <div id="live-feed" class="live-feed">
        <div class="feed-empty">
          <div class="feed-empty-icon">📡</div>
          <p>Start capture to see live events</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0 · Analytics only · No predictions</span>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
