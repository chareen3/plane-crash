<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a14" />
  <title>Offline · CrashTracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #060a14;
      color: #e8eeff;
      text-align: center;
    }
    .card {
      max-width: 360px;
      padding: 28px 22px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 213, 0.2);
      background: linear-gradient(160deg, rgba(14, 22, 40, 0.98), rgba(8, 12, 22, 0.98));
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: #8b95b0;
      margin-bottom: 18px;
    }
    button {
      min-height: 46px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00ffd5, #00a8ff);
      color: #060a14;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="CrashTracker" width="64" height="64" />
    <h1>You're offline</h1>
    <p>CrashTracker needs a connection for live signals. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
